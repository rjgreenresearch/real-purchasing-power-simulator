[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpps"
version = "0.3.0"
description = "Real Purchasing Power Simulator — MTS Pillar 6 (Welfare Measurement Architecture)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Robert J. Green" }
]
keywords = [
    "welfare-measurement",
    "real-wages",
    "productivity",
    "purchasing-power",
    "FRED",
    "NBER",
    "structural-breaks",
    "Bai-Perron",
    "MTS-doctrine",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "requests>=2.31",
    "matplotlib>=3.7",
    "ruptures>=1.1.9",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/rjgreenresearch/real-purchasing-power-simulator"
Repository = "https://github.com/rjgreenresearch/real-purchasing-power-simulator"
Documentation = "https://github.com/rjgreenresearch/real-purchasing-power-simulator/blob/main/README.md"
"Companion paper" = "https://rjgreenresearch.org/"

[tool.setuptools]
packages = ["rpps", "rpps.metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
